[workspace]
resolver = "2"
members = [
  "backend/crates/crow-ui-text",
  "backend/crates/crow-ui-workspace",
  "backend/crates/crow-ui-acp",
  "backend/crates/crow-ui-lsp",
  "backend/crates/crow-ui-syntax",
  "backend/crates/crow-ui-git",
  "backend/crates/crow-ui-terminal",
  "backend/crates/crow-ui-settings",
  "backend/crates/crow-ui-theme",
  "backend/crates/crow-ui-textmate",
  "backend/crates/crow-ui-db",
  "backend/crates/crow-ui-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
repository = "https://github.com/crow-cli/crow-ui"

[workspace.dependencies]
# Internal crates
crow-ui-text = { path = "backend/crates/crow-ui-text" }
crow-ui-workspace = { path = "backend/crates/crow-ui-workspace" }
crow-ui-lsp = { path = "backend/crates/crow-ui-lsp" }
crow-ui-syntax = { path = "backend/crates/crow-ui-syntax" }
crow-ui-git = { path = "backend/crates/crow-ui-git" }
crow-ui-terminal = { path = "backend/crates/crow-ui-terminal" }
crow-ui-settings = { path = "backend/crates/crow-ui-settings" }
crow-ui-theme = { path = "backend/crates/crow-ui-theme" }
crow-ui-textmate = { path = "backend/crates/crow-ui-textmate" }
crow-ui-db = { path = "backend/crates/crow-ui-db" }
crow-ui-server = { path = "backend/crates/crow-ui-server" }
crow-ui-acp = { path = "backend/crates/crow-ui-acp" }

# Core
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"

# Web
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors"] }
tokio-tungstenite = "0.26"
futures = "0.3"

# Text
ropey = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
regex = "1"
memchr = "2"

# Syntax & Language
tree-sitter = "0.24"

# File system
notify = { version = "7", features = ["macos_fsevent"] }
walkdir = "2"
globset = "0.4"
ignore = "0.4"

# Terminal
portable-pty = "0.8"
vte = "0.13"

# Git
gix = { version = "0.68", default-features = false }

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# HTTP
reqwest = { version = "0.12", features = ["rustls-tls"] }
agent-client-protocol-schema = { version = "0.12.0", features = ["unstable"] }

# Type generation
ts-rs = "12"

# Concurrency
crossbeam = "0.8"
dashmap = "6"
rayon = "1"
parking_lot = "0.12"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "crow-ui-server"
description = "WebSocket server for crow-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crow-ui-text = { workspace = true }
crow-ui-workspace = { workspace = true }
crow-ui-terminal = { workspace = true }
crow-ui-acp = { workspace = true }
crow-ui-db = { workspace = true }
crow-ui-settings = { workspace = true }
agent-client-protocol-schema = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

axum = { workspace = true, features = ["ws", "macros"] }
tower = { workspace = true }
tower-http = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }

notify = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }

ts-rs = { workspace = true, features = ["uuid-impl", "serde-json-impl"] }
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
serde_yml = "0.0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[[bin]]
name = "crow-ui-server"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package]
name = "flexlayout-state-server"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "
8"
mime_guess = "2"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"
parking_lot = "0.12"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "flexlayout-state-server"
path = "src/main.rs"
